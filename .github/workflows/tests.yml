name: testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Rodar testes (pytest, inclui o pipeline com dbt sobre dados sintéticos)
        run: pytest -v
      - name: dbt build com dados sintéticos (sem rede, sem pacotes do dbt Hub)
        run: python -m sismigra.sinteticos "$RUNNER_TEMP/sinteticos"
      - name: Conferir que ref/ e publicacao/ não foram alterados
        run: git diff --exit-code -- ref/ publicacao/
