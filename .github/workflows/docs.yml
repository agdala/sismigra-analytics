name: dbt docs

# Publica o site do dbt docs no GitHub Pages a cada push no main.
# O site é gerado a partir de dados SINTÉTICOS: mostra estrutura, descrições, testes e linhagem,
# sem nenhum dado real. Requer Settings > Pages > Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Gerar o site do dbt docs com dados sintéticos
        run: python -m sismigra.sinteticos "$RUNNER_TEMP/sinteticos" --docs
      - name: Montar o site
        run: |
          mkdir -p site
          cp dbt/target/static_index.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
