name: dbt docs

# Publica o site do dbt docs no GitHub Pages a cada push no main.
# O site é gerado a partir de dados SINTÉTICOS: mostra estrutura, descrições, testes e linhagem,
# sem nenhum dado real. Requer Settings > Pages > Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Gerar o site do dbt docs com dados sintéticos
        run: python -m sismigra.sinteticos "$RUNNER_TEMP/sinteticos" --docs
      - name: Montar o site
        run: |
          mkdir -p site
          cp dbt/target/static_index.html site/index.html
          cp docs/social-preview.png site/social-preview.png
      # O dbt docs não tem template próprio: as tags de prévia social (Open Graph) entram
      # por substituição no <head> do HTML gerado. Os números vêm dos relatórios versionados.
      # O mesmo passo libera o zoom no celular, bloqueado pelo viewport padrão do dbt docs.
      - name: Tags de prévia social (Open Graph)
        run: |
          python - <<'PY'
          import html, json
          from pathlib import Path
          url = "https://agdala.github.io/sismigra-analytics/"
          q = json.loads(Path("reports/qualidade/relatorio_qualidade.json").read_text(encoding="utf-8"))
          pub = json.loads(Path("publicacao/metadados.json").read_text(encoding="utf-8"))
          pct_pub = min(t["pct_publicado"] for t in pub["tabelas"].values())
          br = lambda v, c=0: f"{v:,.{c}f}".replace(",", "X").replace(".", ",").replace("X", ".")
          desc = (f"{br(q['totais']['lidas'])} registros do SISMIGRA (2021 a 2026, 2026 parcial) em camadas "
                  f"testadas com dbt e DuckDB; {br(q['municipios']['pct_casados_entre_especificados'], 3)}% "
                  f"dos municípios informados com código IBGE e {br(int(pct_pub * 100) / 100, 2)}% dos registros "
                  f"publicados com k = {pub['limiar_k']}. Documentação gerada com dados sintéticos.")
          tags = {
              "og:type": "website", "og:locale": "pt_BR", "og:site_name": "sismigra-analytics · Agda Santos",
              "og:title": "sismigra-analytics: documentação dos modelos (dbt docs)", "og:description": desc,
              "og:url": url, "og:image": url + "social-preview.png", "og:image:width": "1280",
              "og:image:height": "640",
              "og:image:alt": "sismigra-analytics, etapa Transformar e publicar do ciclo de dados",
          }
          meta = "".join(f'<meta property="{k}" content="{html.escape(v)}">' for k, v in tags.items())
          meta += '<meta name="twitter:card" content="summary_large_image">'
          site = Path("site/index.html")
          doc = site.read_text(encoding="utf-8")
          assert doc.count("<head>") == 1, "esperado um único <head> no dbt docs"
          doc = doc.replace("<head>", "<head>" + meta, 1)
          # libera o zoom no celular (o viewport padrão do dbt docs fixa maximum-scale=1)
          doc = doc.replace("minimum-scale=1,maximum-scale=1,", "")
          site.write_text(doc, encoding="utf-8")
          print(meta)
          PY
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
